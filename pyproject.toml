[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htmlvault"
version = "0.1.0"
description = "Your AI-generated HTML showcase. Scan directories, auto-categorize, browse in a gallery."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "makino", email = "chenyyhit@gmail.com"}]
keywords = ["html", "gallery", "ai", "cli", "showcase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.scripts]
htmlvault = "htmlvault.cli:main"

[project.urls]
Homepage = "https://github.com/makinotes/htmlvault"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["htmlvault*"]

[tool.setuptools.package-data]
htmlvault = ["template/*.html"]
