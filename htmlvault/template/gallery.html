<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLVault</title>
<style>
:root { --bg: #0a0a0a; --surface: #111; --border: #1e1e1e; --border-hover: #333; --text: #e5e5e5; --text-dim: #666; --text-muted: #444; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: inherit; text-decoration: none; }

/* Header */
.header { padding: 24px 40px 18px; border-bottom: 1px solid #222; display: flex; align-items: baseline; gap: 16px; }
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.header .subtitle { font-size: 13px; color: var(--text-dim); }

/* Toolbar */
.toolbar { display: flex; gap: 12px; align-items: center; padding: 12px 40px; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap; }
.search-box { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 7px 14px; color: var(--text); font-size: 13px; width: 260px; outline: none; transition: border-color 0.2s; }
.search-box:focus { border-color: #444; }
.search-box::placeholder { color: #555; }
.filter-tags { display: flex; gap: 6px; }
.ftag { padding: 4px 11px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #2a2a2a; background: transparent; color: #888; transition: all 0.15s; user-select: none; }
.ftag:hover { border-color: #444; color: #ccc; }
.ftag.active { background: #1a1a1a; border-color: #444; color: var(--text); }
.ftag .cnt { opacity: 0.45; margin-left: 3px; }
.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stats { font-size: 12px; color: #555; }
.btn-group { display: flex; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; }
.gbtn { padding: 5px 10px; background: transparent; border: none; color: #555; cursor: pointer; font-size: 12px; transition: all 0.15s; }
.gbtn:hover { color: #888; }
.gbtn.active { background: #1a1a1a; color: var(--text); }

/* Badges */
.badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.badge-slide { background: #1e1b4b; color: #818cf8; }
.badge-chart { background: #052e16; color: #4ade80; }
.badge-dashboard { background: #172554; color: #60a5fa; }
.badge-page { background: #1c1917; color: #a8a29e; }
.badge-card { background: #2a1708; color: #fb923c; }

/* Buttons */
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent; background: transparent; cursor: pointer; color: #444; transition: all 0.15s; flex-shrink: 0; }
.icon-btn:hover { background: #1a1a1a; border-color: #333; color: #aaa; }
.icon-btn svg { pointer-events: none; }
.pin-btn.pinned { color: #eab308; }
.pin-btn.pinned:hover { color: #ca8a04; }

/* Content */
.content { padding: 20px 40px; }

/* Section headers */
.section { margin-bottom: 24px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #1a1a1a; }
.section-header h2 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.section-count { font-size: 11px; color: #555; background: #1a1a1a; padding: 1px 7px; border-radius: 10px; }
.section.no-header .section-header { display: none; }

/* Grid view */
.view-grid .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.view-grid .item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: all 0.15s; }
.view-grid .item:hover { border-color: var(--border-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.view-grid .item-thumb { aspect-ratio: 16/9; background: #0d0d0d; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.view-grid .item-body { padding: 10px 12px; }
.view-grid .item-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.view-grid .item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; }
.view-grid .item-title:hover { color: #fff; }
.view-grid .item-meta { display: flex; align-items: center; gap: 8px; }
.view-grid .item-path { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.view-grid .item-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

/* List view */
.view-list .items { display: flex; flex-direction: column; gap: 1px; }
.view-list .item { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 6px; transition: background 0.1s; }
.view-list .item:hover { background: #151515; }
.view-list .item-thumb { display: none; }
.view-list .item-body { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
.view-list .item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 180px; max-width: 300px; }
.view-list .item-title:hover { color: #fff; }
.view-list .item-meta { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.view-list .item-path { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-family: 'SF Mono', Menlo, monospace; }
.view-list .item-date { font-size: 12px; color: #555; white-space: nowrap; min-width: 46px; text-align: right; }
.view-list .item-size { font-size: 12px; color: #444; white-space: nowrap; min-width: 52px; text-align: right; }
.view-list .item-row { display: contents; }

/* Version collapse */
.version-toggle { font-size: 11px; color: #555; cursor: pointer; padding: 4px 10px; border-radius: 4px; margin-top: 4px; display: inline-block; }
.version-toggle:hover { color: #888; background: #151515; }
.version-hidden { display: none; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 200; border: 1px solid #333; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; padding: 60px 40px; color: #444; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <h1>HTMLVault</h1>
  <div class="subtitle" id="subtitle"></div>
</div>

<div class="toolbar">
  <input type="text" class="search-box" placeholder="Search files..." id="search" oninput="render()">
  <div class="filter-tags" id="type-filters"></div>
  <div class="toolbar-right">
    <div class="btn-group" id="group-btns">
      <button class="gbtn active" onclick="setGroup('folder',this)">Folder</button>
      <button class="gbtn" onclick="setGroup('type',this)">Type</button>
      <button class="gbtn" onclick="setGroup('none',this)">Flat</button>
    </div>
    <div class="btn-group" id="view-btns">
      <button class="gbtn active" onclick="setView('grid',this)">Grid</button>
      <button class="gbtn" onclick="setView('list',this)">List</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
// --- Data injected by generator.py ---
const BASE = "{{ base_dir }}";
const SCAN_DATE = "{{ scan_date }}";
const FILES = {{ files_json }};
let PINS = {{ pins_json }};
// --- End data ---

const IS_SERVE = location.protocol === 'http:' || location.protocol === 'https:';

const ICONS = {
  slide: { bg: 'linear-gradient(135deg,#1e1b4b,#312e81)', svg: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>' },
  chart: { bg: 'linear-gradient(135deg,#052e16,#064e3b)', svg: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-5"/></svg>' },
  dashboard: { bg: 'linear-gradient(135deg,#172554,#1e3a5f)', svg: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="14" y="10" width="7" height="11" rx="1"/><rect x="3" y="13" width="7" height="8" rx="1"/></svg>' },
  card: { bg: 'linear-gradient(135deg,#2a1708,#431407)', svg: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>' },
  page: { bg: 'linear-gradient(135deg,#1c1917,#292524)', svg: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>' },
};
const SVG_FOLDER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>';
const SVG_PIN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16 2l-4 4-5-2-3 3 4 5-6 6h2l4-4 5 4 3-3-2-5 4-4-2-4z"/></svg>';
const SVG_PIN_OUTLINE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 2l-4 4-5-2-3 3 4 5-6 6h2l4-4 5 4 3-3-2-5 4-4-2-4z"/></svg>';

let view = 'grid', groupBy = 'folder';

// -- Init --
document.getElementById('subtitle').textContent = BASE + ' \u2014 ' + FILES.length + ' files \u2014 ' + SCAN_DATE;
buildTypeFilters();
render();

function buildTypeFilters() {
  const counts = {};
  FILES.forEach(f => { counts[f.type] = (counts[f.type] || 0) + 1; });
  const el = document.getElementById('type-filters');
  let html = '<div class="ftag active" data-f="all" onclick="setTypeFilter(\'all\',this)">All<span class="cnt">' + FILES.length + '</span></div>';
  ['slide','chart','dashboard','card','page'].forEach(t => {
    if (counts[t]) html += '<div class="ftag" data-f="'+t+'" onclick="setTypeFilter(\''+t+'\',this)">'+t.charAt(0).toUpperCase()+t.slice(1)+'s<span class="cnt">'+counts[t]+'</span></div>';
  });
  el.innerHTML = html;
}

let typeFilter = 'all';
function setTypeFilter(t, el) { typeFilter = t; document.querySelectorAll('.ftag').forEach(e=>e.classList.remove('active')); el.classList.add('active'); render(); }
function setView(v, el) { view = v; document.querySelectorAll('#view-btns .gbtn').forEach(e=>e.classList.remove('active')); el.classList.add('active'); render(); }
function setGroup(g, el) { groupBy = g; document.querySelectorAll('#group-btns .gbtn').forEach(e=>e.classList.remove('active')); el.classList.add('active'); render(); }

function isPinned(relpath) { return PINS.indexOf(relpath) !== -1; }

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return FILES.filter(f => {
    if (typeFilter !== 'all' && f.type !== typeFilter) return false;
    if (q && f.name.toLowerCase().indexOf(q) === -1 && f.relpath.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

// -- Actions --
function openFile(absPath, ev) {
  ev.preventDefault(); ev.stopPropagation();
  if (IS_SERVE) {
    fetch('/api/open-file?path=' + encodeURIComponent(absPath));
  } else {
    window.open('file://' + encodeURI(absPath).replace(/#/g,'%23'), '_blank');
  }
}
function openFolder(absPath, ev) {
  ev.preventDefault(); ev.stopPropagation();
  if (IS_SERVE) {
    fetch('/api/open-folder?path=' + encodeURIComponent(absPath));
  } else {
    toast('Serve mode required for Finder. Run: htmlvault serve');
  }
}
function togglePin(relpath, ev) {
  ev.preventDefault(); ev.stopPropagation();
  if (!IS_SERVE) { toast('Serve mode required for pinning.'); return; }
  const pinned = isPinned(relpath);
  const endpoint = pinned ? '/api/unpin' : '/api/pin';
  fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({relpath: relpath})
  }).then(r => r.json()).then(d => {
    if (d.ok) { PINS = d.pins; render(); }
  });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function shortDate(ts) { const d = new Date(ts * 1000); return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function folderOf(absPath) { return absPath.substring(0, absPath.lastIndexOf('/')); }

// -- Render --
function renderItem(f) {
  const ic = ICONS[f.type] || ICONS.page;
  const pinCls = isPinned(f.relpath) ? 'pinned' : '';
  const pinSvg = isPinned(f.relpath) ? SVG_PIN : SVG_PIN_OUTLINE;
  const fp = esc(f.path);
  const dp = esc(folderOf(f.path));
  const rp = esc(f.relpath);

  if (view === 'grid') {
    return '<div class="item">' +
      '<div class="item-thumb" onclick="openFile(\'' + fp + '\',event)" style="background:' + ic.bg + '">' + ic.svg + '</div>' +
      '<div class="item-body">' +
        '<div class="item-row">' +
          '<span class="item-title" onclick="openFile(\'' + fp + '\',event)">' + f.name + '</span>' +
          '<button class="icon-btn pin-btn ' + pinCls + '" onclick="togglePin(\'' + rp + '\',event)" title="Pin">' + pinSvg + '</button>' +
          '<button class="icon-btn" onclick="openFolder(\'' + dp + '\',event)" title="Open folder">' + SVG_FOLDER + '</button>' +
        '</div>' +
        '<div class="item-meta">' +
          '<span class="badge badge-' + f.type + '">' + f.type + '</span>' +
          '<span class="item-path">' + f.relpath + '</span>' +
          '<span class="item-date">' + shortDate(f.mtime) + '</span>' +
        '</div>' +
      '</div></div>';
  } else {
    return '<div class="item">' +
      '<div class="item-body" onclick="openFile(\'' + fp + '\',event)">' +
        '<span class="badge badge-' + f.type + '">' + f.type + '</span>' +
        '<span class="item-title">' + f.name + '</span>' +
        '<span class="item-meta">' +
          '<span class="item-path">' + f.relpath + '</span>' +
          '<span class="item-size">' + f.size_fmt + '</span>' +
          '<span class="item-date">' + shortDate(f.mtime) + '</span>' +
        '</span>' +
      '</div>' +
      '<button class="icon-btn pin-btn ' + pinCls + '" onclick="togglePin(\'' + rp + '\',event)" title="Pin">' + pinSvg + '</button>' +
      '<button class="icon-btn" onclick="openFolder(\'' + dp + '\',event)" title="Open folder">' + SVG_FOLDER + '</button>' +
    '</div>';
  }
}

function render() {
  const filtered = getFiltered();
  document.getElementById('stats').textContent = filtered.length + ' files';
  const el = document.getElementById('content');

  if (!filtered.length) { el.innerHTML = '<div class="empty">No files match.</div>'; return; }

  // Separate pinned
  const pinned = filtered.filter(f => isPinned(f.relpath));
  const unpinned = filtered.filter(f => !isPinned(f.relpath));

  // Time layers for unpinned
  const now = Date.now() / 1000;
  const WEEK = 7 * 86400;
  const recent = unpinned.filter(f => (now - f.mtime) < WEEK);
  const older = unpinned.filter(f => (now - f.mtime) >= WEEK);

  let html = '';
  el.className = 'content view-' + view;

  if (groupBy === 'none') {
    // Flat: Pinned section + all others by time
    if (pinned.length) html += renderSection('Pinned', pinned);
    if (recent.length) html += renderSection('Recent', recent);
    if (older.length) html += renderSection('Older', older);
  } else {
    // Grouped: Pinned always first, then groups
    if (pinned.length) html += renderSection('Pinned', pinned);

    const groupKey = groupBy === 'folder' ? 'folder' : 'type';
    const groups = {};
    unpinned.forEach(f => {
      const k = f[groupKey] || '.';
      if (!groups[k]) groups[k] = [];
      groups[k].push(f);
    });
    // Sort groups by most recent file
    const keys = Object.keys(groups).sort((a,b) => {
      return Math.max(...groups[b].map(f=>f.mtime)) - Math.max(...groups[a].map(f=>f.mtime));
    });
    keys.forEach(k => {
      const label = groupBy === 'type' ? k.charAt(0).toUpperCase() + k.slice(1) + 's' : k;
      html += renderSection(label, groups[k]);
    });
  }

  el.innerHTML = html;
}

function renderSection(title, files) {
  const sorted = [...files].sort((a,b) => b.mtime - a.mtime);
  return '<div class="section">' +
    '<div class="section-header"><h2>' + title + '</h2><span class="section-count">' + files.length + '</span></div>' +
    '<div class="items">' + sorted.map(renderItem).join('') + '</div>' +
  '</div>';
}
</script>
</body>
</html>
